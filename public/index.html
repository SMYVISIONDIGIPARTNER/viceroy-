<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- =========================================================
         BASIC
    ========================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#2b1c13" />

    <meta name="color-scheme" content="light" />

    <title>
      The Viceroy Collection | Handcrafted Teak, Rosewood & Solid Wood Furniture
    </title>

    <meta
      name="description"
      content="Discover The Viceroy Collection of handcrafted teak doors, rosewood furniture, solid wood furniture and architectural hardwood pieces created with timeless craftsmanship."
    />

    <meta
      name="keywords"
      content="The Viceroy Collection, handcrafted furniture, teak doors, carved teak doors, rosewood furniture, solid wood furniture, hardwood furniture, vintage furniture, luxury furniture, handcrafted doors, architectural woodwork, hand carved furniture"
    />

    <meta name="author" content="The Viceroy Collection" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="referrer" content="strict-origin-when-cross-origin" />


    <!-- =========================================================
         CANONICAL DOMAIN
    ========================================================== -->

    <link
      rel="canonical"
      href="https://www.theviceroycollection.com/"
    />


    <!-- =========================================================
         LOGO / FAVICON
    ========================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="shortcut icon"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo.png"
    />


    <!-- =========================================================
         OPEN GRAPH / FACEBOOK / WHATSAPP
    ========================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="The Viceroy Collection"
    />

    <meta
      property="og:title"
      content="The Viceroy Collection | Handcrafted Teak, Rosewood & Solid Wood Furniture"
    />

    <meta
      property="og:description"
      content="Explore handcrafted teak doors, rosewood furniture, solid wood pieces and architectural hardwood creations from The Viceroy Collection."
    />

    <meta
      property="og:url"
      content="https://www.theviceroycollection.com/"
    />

    <meta
      property="og:image"
      content="https://www.theviceroycollection.com/images/hero.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://www.theviceroycollection.com/images/hero.jpg"
    />

    <meta
      property="og:image:alt"
      content="Handcrafted hardwood furniture and doors by The Viceroy Collection"
    />

    <meta
      property="og:locale"
      content="en_US"
    />


    <!-- =========================================================
         TWITTER / X
    ========================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="The Viceroy Collection | Handcrafted Hardwood Furniture"
    />

    <meta
      name="twitter:description"
      content="Discover handcrafted teak doors, rosewood furniture, solid wood furniture and timeless hardwood craftsmanship."
    />

    <meta
      name="twitter:image"
      content="https://www.theviceroycollection.com/images/hero.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="The Viceroy Collection handcrafted hardwood furniture"
    />


    <!-- =========================================================
         ORGANIZATION / BRAND STRUCTURED DATA
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.theviceroycollection.com/#organization",
        "name": "The Viceroy Collection",
        "url": "https://www.theviceroycollection.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.theviceroycollection.com/logo.png"
        },
        "image": "https://www.theviceroycollection.com/images/hero.jpg",
        "telephone": "+1-224-390-9829",
        "description": "The Viceroy Collection offers handcrafted teak doors, rosewood furniture, solid wood furniture and architectural hardwood pieces."
      }
    </script>


    <!-- =========================================================
         WEBSITE STRUCTURED DATA
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.theviceroycollection.com/#website",
        "url": "https://www.theviceroycollection.com/",
        "name": "The Viceroy Collection",
        "description": "Handcrafted teak doors, rosewood furniture, solid wood furniture and architectural hardwood pieces.",
        "publisher": {
          "@id": "https://www.theviceroycollection.com/#organization"
        },
        "inLanguage": "en-US"
      }
    </script>


    <!-- =========================================================
         HOME PAGE STRUCTURED DATA
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://www.theviceroycollection.com/#webpage",
        "url": "https://www.theviceroycollection.com/",
        "name": "The Viceroy Collection | Handcrafted Teak, Rosewood & Solid Wood Furniture",
        "description": "Discover handcrafted teak doors, rosewood furniture, solid wood furniture and architectural hardwood creations from The Viceroy Collection.",
        "isPartOf": {
          "@id": "https://www.theviceroycollection.com/#website"
        },
        "about": {
          "@id": "https://www.theviceroycollection.com/#organization"
        },
        "primaryImageOfPage": {
          "@type": "ImageObject",
          "url": "https://www.theviceroycollection.com/images/hero.jpg"
        },
        "inLanguage": "en-US"
      }
    </script>


    <!-- =========================================================
         CONTACT STRUCTURED DATA
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ContactPoint",
        "telephone": "+1-224-390-9829",
        "contactType": "customer service",
        "availableLanguage": [
          "English"
        ]
      }
    </script>


    <!-- =========================================================
         PRELOAD IMPORTANT HOME IMAGE
    ========================================================== -->

    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/images/hero.jpg"
      fetchpriority="high"
    />


    <!-- =========================================================
         MANIFEST
    ========================================================== -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

  </head>

  <body>

    <noscript>
      The Viceroy Collection website requires JavaScript to display
      our handcrafted teak doors, rosewood furniture and solid wood
      collections.
    </noscript>

    <div id="root"></div>

  </body>
</html>
